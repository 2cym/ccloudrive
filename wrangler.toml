#:schema node_modules/wrangler/config-schema.json
name = "yuanshennb"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"

# Workers 无 Node 文件系统；Next.js 运行时需要 nodejs_compat
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_APP_NAME = "云盘"
# 本地开发地址；生产请改成你的 workers 自定义域名
AUTH_URL = "http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "yuanshennb-db"
database_id = "REPLACE_WITH_YOUR_D1_ID"
# drizzle-kit 默认输出到 drizzle/migrations，而 wrangler 默认找 ./migrations，
# 不显式指定就会报 "No migrations present at .../migrations"。
migrations_dir = "drizzle/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "yuanshennb-files"

[[kv_namespaces]]
binding = "KV"
id = "REPLACE_WITH_YOUR_KV_ID"

[observability]
enabled = true

# ---------- 本地开发 ----------
# 敏感变量放 .dev.vars（不要提交到 git）：
#   AUTH_SECRET=xxxx
# 生产用：npx wrangler secret put AUTH_SECRET

# ---------- 常用指令 ----------
# npx wrangler d1 create yuanshennb-db
# npx wrangler r2 bucket create yuanshennb-files
# npx wrangler kv namespace create KV
# npx wrangler d1 migrations apply yuanshennb-db --local
