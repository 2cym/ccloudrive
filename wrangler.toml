#:schema node_modules/wrangler/config-schema.json
name = "ccloudrive"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"

# Workers 鏃?Node 鏂囦欢绯荤粺锛汵ext.js 杩愯鏃堕渶瑕?nodejs_compat
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_APP_NAME = "浜戠洏"
# 閮ㄧ讲鍚庢嬁鍒?workers.dev 鍦板潃鍐嶆敼锛屾敼鎴?https://yuanshennb.<浣犵殑瀛愬煙>.workers.dev
AUTH_URL = "http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "ccloudrive-db"
database_id = "f0d48672-a2ad-4ec6-bf4e-e408696f878f"
migrations_dir = "drizzle/migrations"

# R2 鏆傛椂涓嶅惎鐢紙闇€瑕佺粦鍗″紑閫氾紝鍚庣画鏂囦欢绠＄悊鏃跺啀琛ワ級
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "yuanshennb-files"

[[kv_namespaces]]
binding = "KV"
id = "fac9597778c34a84b26dad75406b01c3"

[observability]
enabled = true
