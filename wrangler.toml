#:schema node_modules/wrangler/config-schema.json
name = "ccloudrive"
main = ".open-next/worker.js"
compatibility_date = "2024-12-30"

# Workers �?Node 文件系统；Next.js 运行时需�?nodejs_compat
compatibility_flags = ["nodejs_compat"]

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
NEXT_PUBLIC_APP_NAME = "云盘"
# 部署后拿�?workers.dev 地址再改，改�?https://yuanshennb.<你的子域>.workers.dev
AUTH_URL = "http://localhost:8788"

[[d1_databases]]
binding = "DB"
database_name = "ccloudrive-db"
database_id = "f0d48672-a2ad-4ec6-bf4e-e408696f878f"
migrations_dir = "drizzle/migrations"

# R2 暂时不启用（需要绑卡开通，后续文件管理时再补）
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "yuanshennb-files"

[[kv_namespaces]]
binding = "KV"
id = "fac9597778c34a84b26dad75406b01c3"

[observability]
enabled = true
